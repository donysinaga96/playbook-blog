# =====================================================================
# Development stack - framework web artikel multi-site / multi-template
#
#   docker compose up -d                              # db + migration + role app + seed
#   docker compose --profile test  run --rm db-test   # 84 pemeriksaan packages/db
#   docker compose --profile tools up -d adminer      # UI database di http://localhost:8080
#
# Aplikasi Nuxt TIDAK jalan di sini saat development: jalankan `pnpm dev`
# di host (hot reload lebih cepat) dan arahkan ke DATABASE_URL di .env.
# Redis/BullMQ belum dibutuhkan sampai fitur AI (M6+).
# =====================================================================
name: blog-framework

x-pg-image: &pg-image postgres:18.7

# Koneksi pemilik schema untuk service tooling (migrate, test).
x-pg-owner-env: &pg-owner-env
  PGHOST: db
  PGPORT: "5432"
  PGUSER: ${POSTGRES_USER:-blog}
  PGPASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
  PGDATABASE: ${POSTGRES_DB:-blog_dev}

services:
  db:
    image: *pg-image
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
      POSTGRES_DB: ${POSTGRES_DB:-blog_dev}
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - log_min_duration_statement=250   # log query lebih lambat dari 250 ms
    # PostgreSQL 18+: volume di /var/lib/postgresql (BUKAN .../data);
    # PGDATA image = /var/lib/postgresql/18/docker.
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Sekali jalan: migration -> role aplikasi -> role AI agent -> seed dev. Aman diulang.
  db-migrate:
    image: *pg-image
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    entrypoint: ["sh", "/db/scripts/setup.sh"]
    environment:
      <<: *pg-owner-env
      APP_DB_USER: ${APP_DB_USER:-blog_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?isi APP_DB_PASSWORD di .env}
      AGENT_DB_USER: ${AGENT_DB_USER:-blog_agent}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:-}
      SEED_DEV_DATA: ${SEED_DEV_DATA:-true}
    volumes:
      - ./packages/db:/db:ro

  # Uji lengkap packages/db di database terpisah (blog_framework_test).
  db-test:
    profiles: ["test"]
    image: *pg-image
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    entrypoint: ["bash", "/db/run_all.sh", "blog_framework_test"]
    environment:
      <<: *pg-owner-env
      PGDATABASE: postgres
      APP_DB_USER: ${APP_DB_USER:-blog_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?isi APP_DB_PASSWORD di .env}
      AGENT_DB_USER: ${AGENT_DB_USER:-blog_agent}
    volumes:
      - ./packages/db:/db:ro

  # Backup database + media (M5 5.3): pnpm db:backup. Hasil di BACKUP_DIR
  # (bawaan ./.data/backups); user host agar file tidak milik root.
  db-backup:
    profiles: ["tools"]
    image: *pg-image
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    entrypoint: ["sh", "/db/scripts/backup.sh"]
    environment:
      <<: *pg-owner-env
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - ./packages/db:/db:ro
      - ${BACKUP_DIR:-./.data/backups}:/backups
      - ${MEDIA_DIR:-./.data/media}:/media:ro

  # Restore satu set backup ke database BARU lalu periksa (M5 5.3):
  #   pnpm db:restore <nama-set> <database-tujuan>
  # Media diekstrak ke ./.data/media-restore (harus kosong).
  db-restore:
    profiles: ["tools"]
    image: *pg-image
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    entrypoint: ["sh", "/db/scripts/restore.sh"]
    environment:
      <<: *pg-owner-env
      APP_DB_USER: ${APP_DB_USER:-blog_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?isi APP_DB_PASSWORD di .env}
      AGENT_DB_USER: ${AGENT_DB_USER:-blog_agent}
    volumes:
      - ./packages/db:/db:ro
      - ${BACKUP_DIR:-./.data/backups}:/backups:ro
      - ./.data/media-restore:/media-restore

  # UI database opsional. Login: System PostgreSQL, server db.
  adminer:
    profiles: ["tools"]
    image: adminer:5.4.2
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"

volumes:
  pgdata:
