# =====================================================================
# CI - framework web artikel multi-site / multi-template
#   check : lint, typecheck, unit test (Node 24 + pnpm dari corepack),
#           termasuk test repository yang membaca PostgreSQL 18 yang sudah
#           di-migrate dan di-seed, sebagai role aplikasi blog_app
#   db    : uji lengkap packages/db (run_all.sh, 81 pemeriksaan) di
#           PostgreSQL 18 sebagai service
#   build : nuxt build apps/web + smoke test hasil build: tanpa database
#           (/api/health 503, bukan crash), lalu dengan database ber-seed
#           (health 200 + halaman tekno/kuliner dirender), lalu gate M2:
#           request SSR paralel ke dua domain tidak saling tertukar; gate admin
#           (M4) dan gate konten AI (M5a)
# =====================================================================

stages:
  - check

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

check:
  stage: check
  image: node:24
  services:
    - name: postgres:18.7
      alias: db
      command: ["postgres", "-c", "timezone=UTC"]
  variables:
    COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    PNPM_STORE_DIR: "$CI_PROJECT_DIR/.pnpm-store"
    # Container service
    POSTGRES_USER: blog
    POSTGRES_PASSWORD: ci_owner_password
    POSTGRES_DB: blog_dev
    # psql di job (libpq) = pemilik schema, untuk migration dan seed
    PGHOST: db
    PGPORT: "5432"
    PGUSER: blog
    PGPASSWORD: ci_owner_password
    PGDATABASE: blog_dev
    APP_DB_USER: blog_app
    APP_DB_PASSWORD: ci_app_password
    AGENT_DB_USER: blog_agent
    AGENT_DB_PASSWORD: ci_agent_password
    SEED_DEV_DATA: "true"
    # Dipakai test (Vitest): koneksi sebagai role aplikasi, bukan pemilik schema
    DATABASE_URL: "postgres://blog_app:ci_app_password@db:5432/blog_dev"
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
  before_script:
    # psql untuk scripts/migrate.sh (image node:24 membawa klien 15; cukup untuk server 18)
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends postgresql-client
    - corepack enable pnpm
    - pnpm config set store-dir "$PNPM_STORE_DIR"
    - pnpm install --frozen-lockfile
  script:
    - for i in $(seq 1 30); do pg_isready -q && break; sleep 1; done
    - sh packages/db/scripts/setup.sh
    - pnpm lint
    - pnpm typecheck
    - pnpm test

build:
  stage: check
  image: node:24
  services:
    - name: postgres:18.7
      alias: db
      command: ["postgres", "-c", "timezone=UTC"]
  variables:
    COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    PNPM_STORE_DIR: "$CI_PROJECT_DIR/.pnpm-store"
    POSTGRES_USER: blog
    POSTGRES_PASSWORD: ci_owner_password
    POSTGRES_DB: blog_dev
    PGHOST: db
    PGPORT: "5432"
    PGUSER: blog
    PGPASSWORD: ci_owner_password
    PGDATABASE: blog_dev
    APP_DB_USER: blog_app
    APP_DB_PASSWORD: ci_app_password
    AGENT_DB_USER: blog_agent
    AGENT_DB_PASSWORD: ci_agent_password
    SEED_DEV_DATA: "true"
    SITE_MODE: multi
    # Admin (ADR-009). Nilai khusus CI: database dan server CI dibuang setelah job.
    ADMIN_HOST: admin.localhost
    ADMIN_SESSION_SECRET: ci-only-session-secret-bukan-untuk-produksi-0123456789
    ADMIN_PASSWORD: ci-only-admin-password-2026
    # Upload media (M4 4.3) ke disk sementara job.
    MEDIA_DIR: /tmp/media
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
    policy: pull
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends postgresql-client
    - corepack enable pnpm
    - pnpm config set store-dir "$PNPM_STORE_DIR"
    - pnpm install --frozen-lockfile
  script:
    - pnpm build
    # 1. Tanpa database: server tetap start, /api/health menjawab 503 (bukan crash).
    - DATABASE_URL="postgres://smoke:smoke@127.0.0.1:1/smoke" EXPECT_STATUS=503 pnpm --filter @framework/web smoke
    # 2. Database ber-seed: health 200 dan halaman kedua domain seed dirender
    #    (menangkap bug yang hanya muncul di bundle produksi).
    - for i in $(seq 1 30); do pg_isready -q && break; sleep 1; done
    - sh packages/db/scripts/setup.sh
    - DATABASE_URL="postgres://blog_app:ci_app_password@db:5432/blog_dev" SMOKE_HOSTS=tekno.localhost=magazine,kuliner.localhost=news pnpm --filter @framework/web smoke
    # 3. Gate M2: request paralel ke dua domain tidak saling tertukar.
    - DATABASE_URL="postgres://blog_app:ci_app_password@db:5432/blog_dev" pnpm --filter @framework/web gate
    # 4. Gate admin (M4): admin pertama dibuat lewat CLI, bukan SQL manual.
    - DATABASE_URL="postgres://blog_app:ci_app_password@db:5432/blog_dev" pnpm admin:create --email admin@local.test --reset-password
    - DATABASE_URL="postgres://blog_app:ci_app_password@db:5432/blog_dev" pnpm admin:create --email editor@local.test --name Editor --site kabar-tekno
    - DATABASE_URL="postgres://blog_app:ci_app_password@db:5432/blog_dev" pnpm --filter @framework/web gate:admin
    # 5. Gate M5a: hasil AI ditulis sebagai role agent (login langsung), tidak tampil
    #    sampai di-approve lewat admin, lalu tampil dengan referensinya.
    - DATABASE_URL="postgres://blog_app:ci_app_password@db:5432/blog_dev" AGENT_DATABASE_URL="postgres://blog_agent:ci_agent_password@db:5432/blog_dev" pnpm --filter @framework/web gate:content
  artifacts:
    paths:
      - apps/web/.output/
    expire_in: 1 week

db:
  stage: check
  image: postgres:18.7
  services:
    - name: postgres:18.7
      alias: db
      command: ["postgres", "-c", "timezone=UTC"]
  variables:
    # Untuk container service
    POSTGRES_USER: blog
    POSTGRES_PASSWORD: ci_owner_password
    POSTGRES_DB: postgres
    # Untuk psql di job (libpq)
    PGHOST: db
    PGPORT: "5432"
    PGUSER: blog
    PGPASSWORD: ci_owner_password
    PGDATABASE: postgres
    APP_DB_USER: blog_app
    APP_DB_PASSWORD: ci_app_password
    AGENT_DB_USER: blog_agent
    AGENT_DB_PASSWORD: ci_agent_password
  script:
    - for i in $(seq 1 30); do pg_isready -q && break; sleep 1; done
    - bash packages/db/run_all.sh blog_framework_test
